<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>svgbob — ASCII to SVG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body>
  <div id="app">

    <header id="toolbar">
      <span class="app-brand">
        <span class="brand-ascii">⬡</span>
        <span class="brand-name">svgbob</span>
      </span>

      <div class="toolbar-divider"></div>

      <div id="draw-tools" class="tool-group draw-tools"></div>

      <div class="toolbar-divider"></div>

      <div id="snippet-tools" class="tool-group"></div>

      <div class="toolbar-divider"></div>

      <div class="tool-group action-group">
        <button id="btn-theme" class="action-btn" title="Toggle light / dark theme">
          Dark
        </button>
        <button id="btn-clear" class="action-btn" title="Clear editor (Ctrl+Shift+Delete)">
          Clear
        </button>
        <button id="btn-copy-ascii" class="action-btn" title="Copy ASCII to clipboard">
          Copy ASCII
        </button>
        <button id="btn-copy-svg" class="action-btn" title="Copy SVG markup to clipboard">
          Copy SVG
        </button>
        <button id="btn-export" class="action-btn accent" title="Download diagram.svg">
          ↓ Export SVG
        </button>
      </div>
    </header>

    <main id="panels">
      <section id="editor-pane" aria-label="ASCII editor">
        <div id="editor-mount"></div>
        <div id="block-select-overlay" hidden></div>
        <footer id="editor-footer">
          <span id="cursor-pos">1:1</span>
          <span id="char-count"></span>
        </footer>
      </section>

      <div id="resize-handle" role="separator" aria-orientation="vertical" tabindex="0"
           title="Drag to resize panels"></div>

      <section id="preview-pane" aria-label="SVG preview">
        <div id="svg-mount"></div>
        <footer id="preview-footer">
          <span id="render-time"></span>
          <span id="svg-dims"></span>
        </footer>
      </section>
    </main>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
